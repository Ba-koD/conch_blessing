<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>지뢰 손맛 미리보기</title>
<style>
  :root { color-scheme: dark; }
  body { margin: 0; background: #17120f; color: #eadfd2; font: 13px/1.45 "Malgun Gothic", "Apple SD Gothic Neo", sans-serif; }
  .wrap { display: flex; gap: 14px; padding: 14px; align-items: flex-start; flex-wrap: wrap; }
  canvas { background: #000; image-rendering: pixelated; border: 1px solid #3a302a; display: block; }
  .panel { width: 360px; display: flex; flex-direction: column; gap: 10px; }
  .box { background: #221b17; border: 1px solid #3a302a; border-radius: 6px; padding: 10px 12px; }
  h1 { font-size: 15px; margin: 0 0 4px; }
  h2 { font-size: 13px; margin: 0 0 6px; color: #f3c46a; }
  .modes { display: flex; gap: 6px; flex-wrap: wrap; }
  button { background: #33281f; color: #eadfd2; border: 1px solid #5a4a3c; border-radius: 4px; padding: 5px 9px; cursor: pointer; font: inherit; }
  button.on { background: #6b4b1c; border-color: #c9953f; color: #fff2d6; }
  .row { display: grid; grid-template-columns: 128px 1fr 50px; align-items: center; gap: 6px; margin: 3px 0; }
  .row input[type=range] { width: 100%; }
  .row output { text-align: right; font-variant-numeric: tabular-nums; color: #fff2d6; }
  .check { display: flex; gap: 6px; align-items: center; margin: 4px 0; }
  .syn { display: grid; grid-template-columns: 1fr 1fr; gap: 2px 8px; }
  .syn label { display: flex; gap: 5px; align-items: center; cursor: pointer; }
  .syn label:hover { color: #fff2d6; }
  .stats { display: grid; grid-template-columns: 1fr auto; gap: 2px 10px; font-variant-numeric: tabular-nums; }
  .stats b { color: #fff2d6; font-weight: 600; text-align: right; }
  .bar { height: 10px; border-radius: 3px; background: #3a302a; overflow: hidden; display: flex; margin-top: 6px; }
  .bar span { display: block; height: 100%; }
  .note { color: #a89888; font-size: 12px; }
  kbd { background: #33281f; border: 1px solid #5a4a3c; border-radius: 3px; padding: 0 4px; font-size: 11px; }
</style>
</head>
<body>
<div class="wrap">
  <div>
    <canvas id="c" width="936" height="624"></canvas>
    <div class="note" style="margin-top:6px">
      <kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd> 이동 · <kbd>←</kbd><kbd>↑</kbd><kbd>→</kbd><kbd>↓</kbd> 공격 (누르면 자동 조작이 꺼집니다) ·
      <kbd>R</kbd> 다시 시작 · <kbd>P</kbd> 일시정지
    </div>
    <div class="box" style="margin-top:10px;width:912px">
      <h2>최근 10초</h2>
      <div class="stats" style="grid-template-columns: repeat(4, 1fr auto)">
        <span>초당 깐 지뢰</span><b id="s-rate">0</b>
        <span>공격 1번당 지뢰</span><b id="s-per">0</b>
        <span>바닥의 지뢰</span><b id="s-alive">0</b>
        <span>처치 (분당)</span><b id="s-kills">0</b>
        <span>초당 피해 (눈물)</span><b id="s-tear">0</b>
        <span>초당 피해 (지뢰)</span><b id="s-mine">0</b>
        <span>초당 피해 (합)</span><b id="s-total">0</b>
        <span></span><b></b>
      </div>
      <div class="bar"><span id="b-tear" style="background:#9fc6ff;width:50%"></span><span id="b-mine" style="background:#8fdc4e;width:50%"></span></div>
      <div class="note">파랑 = 눈물 피해, 초록 = 지뢰 피해 (폭탄 효과로 생긴 피해 포함)</div>
    </div>
  </div>
  <div class="panel">
    <div class="box">
      <h1>지뢰 손맛 미리보기</h1>
      <div class="note">게임과 같은 1초 30업데이트, 1칸 = 40유닛으로 돌리는 시험판입니다. 숫자는 모두 초안입니다.</div>
    </div>
    <div class="box">
      <h2>방식</h2>
      <div class="modes">
        <button id="mode-refill" class="on">새 안: 리필</button>
        <button id="mode-interval">이전 안: 주기</button>
        <button id="mode-now">지금 게임</button>
        <button id="mode-none">아이템 없음</button>
      </div>
      <h2 style="margin-top:10px">상대</h2>

const WORLD_SLIDERS = [

const NOTES = {
  refill: "공격력 배율 x0.33, 연사 -0.2, 사거리 +40, 공격은 눈물로 고정. 눈물마다: 한 발이 지뢰 3쌍(행운 5마다 +1쌍)을 지니고 나가 0.2초마다(기본 탄속에서 1.5칸) 좌우 1쌍씩 깔고, 다 쓰고 나면 연사 간격 5번(= 5 / 연사 초, 게임에서는 5 x (MaxFireDelay + 1) 업데이트)을 기다렸다가 3쌍이 한꺼번에 다시 차며, 멈추면 남은 것을 그 자리에 쏟습니다. 체크를 끄면 연사 간격마다 1쌍씩 채워지는 이전 방식입니다. 아이작이: 아이작이 지뢰를 모아 두고(소지 9개, 행운 5마다 +3) 연사 간격마다 3개씩 채워지며, 모든 눈물이 거기서 꺼내 깝니다. 이때는 눈물이 오래 살거나 많아도 총 개수는 늘지 않고 더 빨리 꺼내 쓸 뿐입니다.",
  interval: "공격력 배율 x0.33, 연사 -0.2, 사거리 +40, 공격은 눈물로 고정. 내 눈물은 나가자마자, 그리고 살아 있는 동안 주기마다 지뢰 2개를 좌우로 하나씩 흩뿌리고, 멈춘 자리에 1개를 남깁니다. 주기는 셋 중 고릅니다: 연사 간격(연사가 오르면 눈물 수와 깔기 횟수가 함께 늘어 지뢰가 연사의 제곱으로 늘어남, 멈춘 자리는 행운 5마다 +1), 고정 시간(지뢰가 연사에 정비례, 멈춘 자리는 행운 5마다 +1), 행운 비례(기본 주기 x k/(k+행운): 행운 k에 절반, 2k에 3분의 1, 바닥 없음. 이때 행운은 주기에만 씀). 오래 살거나 많거나 갈라지는 눈물일수록 지뢰가 저절로 늘어납니다. 깔 자리가 없으면 자리가 날 때까지 기다리며, 기다리는 동안의 간격은 쌓이지 않습니다. 지뢰가 터지며 생긴 눈물(슬픈 폭탄)은 지뢰를 깔지 않아 끝없이 이어지지 않습니다.",
  now: "지금 게임의 규칙: 쏜 눈물 한 발이 지뢰 3개(행운 5마다 +1)를 싣고 2칸마다 하나씩 흩뿌리고, 맞거나 벽에 닿으면 남은 지뢰를 그 자리에 쏟습니다. 쏜 눈물만 싣기 때문에 갈라진 눈물은 깔지 않습니다. 비교를 위해 루도비코 같은 시너지도 그대로 돌립니다(실제 게임에서는 막혀 있음).",
  none: "비교용: 아이템 없이 아이작의 기본 눈물만 쏩니다. 눈물 시너지는 그대로 적용됩니다.",
};
// what each synergy box can switch on; in the game these come from the items themselves
const SYN = {
  multishot: 1, ludo: false, antigrav: false, planet: false, rubber: false, wrap: false, parasite: false, homing: false,
  bobby: false, cross: false, mega: false, hot: false, poison: false, sticky: false, butt: false, scatter: false, sad: false,
  brim: false, ghost: false,
};
const SYN_DEFAULTS = { ...SYN };
const TEAR_SYN = [
  ["ludo", "루도비코", "눈물 하나를 조종합니다. 살아 있는 동안 계속 깝니다"],
  ["antigrav", "Anti-Gravity", "눈물이 1초 떠 있다가 날아갑니다"],
  ["planet", "Tiny Planet", "눈물이 아이작 둘레를 돕니다"],
  ["rubber", "Rubber Cement", "눈물이 벽에 튕깁니다"],
  ["wrap", "Continuum", "눈물이 벽을 넘어 반대편에서 나옵니다"],

  ["homing", "Spoon Bender", "눈물이 적을 따라갑니다"],
];
const BOMB_SYN = [
  ["bobby", "Bobby-Bomb", "로봇 지뢰: 무장하면 다리를 펴고 가까운 적에게 기어갑니다"],
  ["cross", "Bomber Boy", "십자 폭발"],
  ["mega", "Mr. Mega", "폭발이 커지고 피해 x1.85"],
  ["hot", "Hot Bombs", "불 붙임 (피해 3번)"],
  ["poison", "Bob's Curse", "독 (피해 4번)"],
  ["sticky", "Sticky Bombs", "3초 느리게"],
  ["butt", "Butt Bombs", "3초 혼란"],
  ["scatter", "Scatter Bombs", "작은 폭탄 4개로 흩어짐"],

  ["brim", "Brimstone Bombs", "십자로 혈사포"],
  ["ghost", "Ghost Bombs", "유령이 나와 적에게 날아가 터짐"],
];
let mode = "refill";
let P = MODES[mode];
let silent = false;

// ---------------------------------------------------------------- images
const canvas = document.getElementById("c");
const ctx = canvas.getContext("2d");
ctx.imageSmoothingEnabled = false;
const IMG = [], GREEN = [];
let ROOMIMG;
function loadImage(src) {
  return new Promise(res => { const i = new Image(); i.onload = () => res(i); i.src = src; });
}
function tint(img, r, g, b, go) {
  const c = document.createElement("canvas"); c.width = img.width; c.height = img.height;
  const x = c.getContext("2d"); x.drawImage(img, 0, 0);
  const d = x.getImageData(0, 0, c.width, c.height), p = d.data;
  for (let i = 0; i < p.length; i += 4) {
    p[i] = p[i] * r; p[i + 1] = Math.min(255, p[i + 1] * g + go * 255); p[i + 2] = p[i + 2] * b;
  }
  x.putImageData(d, 0, 0); return c;
}

// ---------------------------------------------------------------- animation
function frameAt(layer, t, anim) {
  const total = anim.frames;
  const tt = anim.loop ? t % total : Math.min(t, total - 1);
  let acc = 0;
  for (const f of layer.frames) { if (tt < acc + f[11]) return f; acc += f[11]; }
  return anim.loop ? layer.frames[0] : layer.frames[layer.frames.length - 1];
}
function drawAnim(key, name, t, x, y, o = {}) {
  const anim = DATA.anims[key][name];
  if (!anim) return;
  for (const L of anim.layers) {
    const f = frameAt(L, t, anim);
    if (!f || !f[12]) continue;
    const img = (o.green ? GREEN : IMG)[L.sheet];
    ctx.save();
    ctx.translate(x, y);
    if (o.rot) ctx.rotate(o.rot);
    const sc = o.scale || 1;
    ctx.scale(sc * (o.flip ? -1 : 1), sc);
    ctx.translate(f[6], f[7]);
    if (f[10]) ctx.rotate(f[10] * Math.PI / 180);
    ctx.scale(f[8], f[9]);
    ctx.globalAlpha = (o.alpha ?? 1) * f[13];
    if (o.flash) ctx.filter = "brightness(2.2)";
    else if (o.filter) ctx.filter = o.filter;
    ctx.drawImage(img, f[0], f[1], f[2], f[3], -f[4], -f[5], f[2], f[3]);
    ctx.restore();
  }
}
const px = (x, y) => [234 + (x - 320) * S, 156 + (y - 280) * S];

// ---------------------------------------------------------------- sound
let audio = null, noise = null;
function ensureAudio() {
  if (audio || !document.getElementById("sound").checked) return;
  audio = new (window.AudioContext || window.webkitAudioContext)();
  noise = audio.createBuffer(1, audio.sampleRate * 0.4, audio.sampleRate);
  const d = noise.getChannelData(0);
  for (let i = 0; i < d.length; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / d.length, 2);
}
function soundOn() { return !silent && audio && document.getElementById("sound").checked; }
function pop(count, big) {
  if (!soundOn()) return;
  const t = audio.currentTime, vol = Math.min(0.5, 0.16 + 0.05 * count) * (big ? 1.4 : 1);
  const src = audio.createBufferSource(); src.buffer = noise;
  src.playbackRate.value = (big ? 0.55 : 0.8) + Math.random() * 0.5;
  const f = audio.createBiquadFilter(); f.type = "lowpass"; f.frequency.value = (big ? 700 : 1300) + Math.random() * 700;
  const g = audio.createGain();

// one blast: damage, knockback, the bomb's status effects and its picture
function blastAt(x, y, radius, dmg, scale, pictures) {
  if (!pictures.some(p => Math.hypot(p.x - x, p.y - y) < 20)) {
    pictures.push({ x, y });
    effects.push({ key: "boom", name: "Explosion", x, y, z: 0, t: 0, scale, green: true });
  }
  for (const e of enemies) {
    if (e.appear < 1 || e.hp <= 0) continue;
    const d = Math.hypot(e.x - x, e.y - y);
    if (d > radius + e.size) continue;
    hurt(e, dmg, "mine");
    const k = (4 * (1 - d / (radius + e.size)) + 1) * (13 / e.size);
    e.kx += (e.x - x) / (d || 1) * k; e.ky += (e.y - y) / (d || 1) * k;
    if (SYN.hot) e.burn = { n: 3, cd: 20, dmg: dmg * 0.5 };
    if (SYN.poison) e.poison = { n: 4, cd: 20, dmg: dmg * 0.4 };
    if (SYN.sticky) e.slow = 90;
    if (SYN.butt) e.confuse = 90;
  }
}
function explode(m, pictures) {
  m.dead = true;
  const mega = SYN.mega ? 1 : 0;
  const radius = P.radius * (mega ? 1.35 : 1) * (m.small ? 0.65 : 1);
  const dmg = P.mineMul * m.damage * (mega ? 1.85 : 1) * (m.small ? 0.5 : 1);
  const scale = P.blastScale * (mega ? 1.4 : 1) * (m.small ? 0.65 : 1);
  blastAt(m.x, m.y, radius, dmg, scale, pictures);
  if (SYN.cross) {   // Bomber Boy: the blast runs out along a cross
    for (const [dx, dy] of Object.values(DIRS)) for (const k of [1, 2]) {
      const x = m.x + dx * radius * 0.9 * k, y = m.y + dy * radius * 0.9 * k;
      if (inRoom(x, y)) blastAt(x, y, radius * 0.75, dmg, scale * 0.85, pictures);
    }
  }
  if (SYN.scatter && !m.small) {   // breaks into four small bombs that go off by themselves
    for (let i = 0; i < 4; i++) {
      const a = i * Math.PI / 2 + rnd(-0.5, 0.5), r = rnd(0.8, 1.6) * TILE;
      layMine(m.x, m.y, -2, clamp(m.x + Math.cos(a) * r, ROOM.x0 + 8, ROOM.x1 - 8), clamp(m.y + Math.sin(a) * r, ROOM.y0 + 8, ROOM.y1 - 8),
        10, 0.9, m.damage, { small: true });
    }
  }
  if (SYN.sad && !m.small) {   // ten tears in a ring; tears a mine made lay no mines
    for (let i = 0; i < 10; i++) {
      const a = i * Math.PI / 5;
      spawnTear(m.x, m.y, Math.cos(a) * 8, Math.sin(a) * 8, { fromMine: true, damage: playerDamage(), size: 4 });
    }
  }
  if (SYN.brim && !m.small) {   // four Brimstone beams across the room
    for (const [dx, dy] of Object.values(DIRS)) {
      lasers.push({ x: m.x, y: m.y, dx, dy, t: 0 });
      for (const e of enemies) {
        if (e.appear < 1 || e.hp <= 0) continue;
        const along = (e.x - m.x) * dx + (e.y - m.y) * dy, across = Math.abs((e.x - m.x) * dy - (e.y - m.y) * dx);
        if (along > 0 && across <= e.size + 9) hurt(e, dmg, "mine");
      }
    }
    zap();
  }
  if (SYN.ghost && !m.small) ghosts.push({ x: m.x, y: m.y, z: 0, t: 0, damage: dmg });
  for (const o of mines) {
    if (o.dead || o === m || o.fuse >= 0 || o.state === "fall") continue;
    if (Math.hypot(o.x - m.x, o.y - m.y) <= radius) o.fuse = P.chain;
  }
}
function updateGhosts() {
  const pictures = [];
  for (const g of ghosts) {
    g.t++;
    g.z = Math.max(-18, g.z - 1.5);
    if (g.t < 12) continue;   // rises first
    const e = nearestEnemy(g.x, g.y);
    if (e) {
      const dx = e.x - g.x, dy = e.y - g.y, d = Math.hypot(dx, dy) || 1;
      g.x += dx / d * 3.2; g.y += dy / d * 3.2;
      if (d <= e.size + 8) { g.dead = true; blastAt(g.x, g.y, 30, g.damage, P.blastScale * 0.8, pictures); pop(1, false); }
    }
    if (g.t > 150 && !g.dead) { g.dead = true; blastAt(g.x, g.y, 30, g.damage, P.blastScale * 0.8, pictures); }
  }
  ghosts = ghosts.filter(g => !g.dead);
  for (const l of lasers) l.t++;
  lasers = lasers.filter(l => l.t < 14);
}

// ---------------------------------------------------------------- enemies
function hurt(e, amount, kind) {
  amount = Math.min(amount, Math.max(0, e.hp));   // count only what the enemy still had
  if (amount <= 0) return;
  e.hp -= amount; e.flash = 2;
  if (kind === "mine") e.dmg += amount; else e.dmgTear += amount;
  record(kind + "-dmg", amount);
  if (e.hp <= 0) {
    effects.push({ key: "blood", name: "Poof", x: e.x, y: e.y - 6, z: 0, t: 0, scale: e.size / 13 });
    record("kill", 1);
  }
}
function tickStatus(e, key) {
  const s = e[key];
  if (!s) return;
  if (--s.cd <= 0) { hurt(e, s.dmg, "mine"); s.cd = 20; if (--s.n <= 0) e[key] = null; }
}
function updateEnemies() {
  for (const e of enemies) {
    if (e.hp <= 0) continue;
    e.t++;
    if (e.appear < 1) { e.appear = Math.min(1, e.appear + 1 / 20); continue; }
    tickStatus(e, "burn"); tickStatus(e, "poison");
    if (e.hp <= 0) continue;
    let dx = player.x - e.x, dy = player.y - e.y, d = Math.hypot(dx, dy) || 1;
    if (e.confuse > 0) {   // wanders instead of chasing
      e.confuse--;
      if (e.t % 20 === 0) { const a = rnd(0, Math.PI * 2); e.wx = Math.cos(a); e.wy = Math.sin(a); }
      dx = e.wx * d; dy = e.wy * d;
    }
    const sp = W.enemySpeed * (e.slow > 0 ? 0.4 : 1);
    if (e.slow > 0) e.slow--;
    e.vx = e.vx * 0.8 + dx / d * sp * 0.2; e.vy = e.vy * 0.8 + dy / d * sp * 0.2;
    for (const o of enemies) {
      if (o === e || o.hp <= 0) continue;
      const ox = e.x - o.x, oy = e.y - o.y, od = Math.hypot(ox, oy);
      if (od > 0 && od < e.size + o.size) { e.vx += ox / od * 0.4; e.vy += oy / od * 0.4; }
    }
    if (d < e.size + 9) { e.vx -= dx / d * 1.2; e.vy -= dy / d * 1.2; }
    e.x += e.vx + e.kx; e.y += e.vy + e.ky; e.kx *= 0.75; e.ky *= 0.75;
    clampRoom(e, e.size + 1);
    if (e.flash > 0) e.flash--;
  }
  for (const e of enemies) {
    if (e.dmg > 0) { texts.push({ x: e.x, y: e.y - 18 - e.size, t: 0, s: e.dmg.toFixed(1), c: "#9cf05a" }); e.dmg = 0; }
    if (e.dmgTear > 0) { texts.push({ x: e.x + 8, y: e.y - 12 - e.size, t: 0, s: e.dmgTear.toFixed(1), c: "#cfe3ff" }); e.dmgTear = 0; }
  }
  enemies = enemies.filter(e => e.hp > 0);
  if (enemies.length < W.enemies) { if (--spawnCd <= 0) { spawnEnemy(); spawnCd = 12; } }
}

// ---------------------------------------------------------------- loop
function update() {
  tick++;
  if (!SYN.ludo && player.ludo) { poof(player.ludo); player.ludo = null; }
  updatePlayer(); updateTears(); updateMines(); updateGhosts(); updateEnemies();
  for (const f of effects) f.t++;
  effects = effects.filter(f => f.t < DATA.anims[f.key][f.name].frames);
  for (const x of texts) x.t++;
  texts = texts.filter(x => x.t < 24);
  shake *= 0.8;
  log = log.filter(l => tick - l.t < 300);
  if (tick % 6 === 0 && !silent) stats();
}
function stats() {
  const span = Math.max(1, Math.min(tick - resetTick, 300)) / 30;
  let laid = 0, tear = 0, mine = 0, kills = 0, shots = 0;
  for (const l of log) {
    if (l.kind === "laid") laid++;
    else if (l.kind === "tear-dmg") tear += l.value;
    else if (l.kind === "mine-dmg") mine += l.value;
    else if (l.kind === "kill") kills++;
    else if (l.kind === "shot") shots++;
  }
  document.getElementById("s-rate").textContent = (laid / span).toFixed(1);
  document.getElementById("s-per").textContent = shots ? (laid / shots).toFixed(1) : "-";
  document.getElementById("s-alive").textContent = landed();
  document.getElementById("s-tear").textContent = (tear / span).toFixed(1);
  document.getElementById("s-mine").textContent = (mine / span).toFixed(1);
  document.getElementById("s-total").textContent = ((tear + mine) / span).toFixed(1);
  document.getElementById("s-kills").textContent = (kills / span * 60).toFixed(0);
  const sum = tear + mine || 1;
  document.getElementById("b-tear").style.width = (tear / sum * 100) + "%";
  document.getElementById("b-mine").style.width = (mine / sum * 100) + "%";
}
// for checking numbers from the console: average of `runs` fresh runs of `seconds` each
// measure("interval", "mob", { syn: { ludo: true }, world: { tears: 5 } })
function measure(modeKey, scen, o = {}) {
  const seconds = o.seconds || 30, runs = o.runs || 4;
  const keepMode = mode, keepScen = W.scenario, keepW = { ...W }, keepSyn = { ...SYN };
  const demo = document.getElementById("demo"), keepDemo = demo.checked;
  silent = true; demo.checked = true;
  mode = modeKey; P = Object.assign(JSON.parse(JSON.stringify(DEFAULTS[modeKey])), o.mode || {});
  Object.assign(W, SCENARIOS[scen], o.world || {});
  Object.assign(SYN, SYN_DEFAULTS, o.syn || {});
  const sum = { laid: 0, tear: 0, mine: 0, kills: 0, shots: 0, floor: 0, peak: 0 };
  for (let r = 0; r < runs; r++) {
    reset();
    let floor = 0;
    for (let i = 0; i < seconds * 30; i++) { update(); const n = landed(); floor += n; sum.peak = Math.max(sum.peak, n); }
    for (const k of ["laid", "tear", "mine", "kills", "shots"]) sum[k] += total[k];
    sum.floor += floor / (seconds * 30);
  }
  const n = runs * seconds;
  const out = {
    laidPerSec: +(sum.laid / n).toFixed(1), perShot: +(sum.laid / Math.max(1, sum.shots)).toFixed(1),
    floor: +(sum.floor / runs).toFixed(1), peak: sum.peak,
    tearDps: +(sum.tear / n).toFixed(2), mineDps: +(sum.mine / n).toFixed(2), dps: +((sum.tear + sum.mine) / n).toFixed(2),
    killsPerMin: +(sum.kills / n * 60).toFixed(1),
  };
  silent = false; demo.checked = keepDemo;
  mode = keepMode; P = MODES[mode]; Object.assign(W, keepW); W.scenario = keepScen; Object.assign(SYN, keepSyn);
  reset();
  return out;
}

// ---------------------------------------------------------------- drawing
function shadow(x, y, w, h, a = 0.35) {
  const [sx, sy] = px(x, y);
  ctx.fillStyle = `rgba(0,0,0,${a})`;
  ctx.beginPath(); ctx.ellipse(sx, sy, w, h, 0, 0, Math.PI * 2); ctx.fill();
}
function render() {
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.fillStyle = "#000"; ctx.fillRect(0, 0, canvas.width, canvas.height);
  const sx = (Math.random() * 2 - 1) * shake, sy = (Math.random() * 2 - 1) * shake;
  ctx.setTransform(DS, 0, 0, DS, sx * DS, sy * DS);
  ctx.imageSmoothingEnabled = false;
  ctx.drawImage(ROOMIMG, 0, 0);
  // mines on the floor
  const floor = mines.filter(m => m.state !== "fall").sort((a, b) => a.y - b.y);
  for (const m of floor) drawMine(m);
  // Brimstone beams
  for (const l of lasers) drawLaser(l);
  // everything standing, by depth
  const list = [];
  list.push({ y: player.y, draw: drawPlayer });
  for (const e of enemies) list.push({ y: e.y, draw: () => drawEnemy(e) });
  for (const t of tears) list.push({ y: t.y, draw: () => drawTear(t) });
  for (const m of mines) if (m.state === "fall") list.push({ y: m.y, draw: () => drawFalling(m) });
  for (const g of ghosts) list.push({ y: g.y, draw: () => drawGhost(g) });
  for (const f of effects) list.push({ y: f.y + 1, draw: () => drawEffect(f) });
  list.sort((a, b) => a.y - b.y);
  for (const it of list) it.draw();
  // text on top, at display scale
  ctx.setTransform(1, 0, 0, 1, sx * DS, sy * DS);
  ctx.font = "bold 13px 'Malgun Gothic', sans-serif"; ctx.textAlign = "center";
  for (const t of texts) {
    const [x, y] = px(t.x, t.y - t.t * 0.8);
    ctx.globalAlpha = 1 - Math.max(0, t.t - 14) / 10;
    ctx.lineWidth = 3; ctx.strokeStyle = "#000"; ctx.strokeText(t.s, x * DS, y * DS);
    ctx.fillStyle = t.c; ctx.fillText(t.s, x * DS, y * DS);
  }
  ctx.globalAlpha = 1;
  if (document.getElementById("bars").checked) {
    for (const e of enemies) {
      if (e.appear < 1) continue;
      const [x, y] = px(e.x, e.y), w = e.size > 20 ? 70 : 30;
      ctx.fillStyle = "#000"; ctx.fillRect(x * DS - w / 2, y * DS - 46 - e.size * 2, w, 5);
      ctx.fillStyle = "#e0423a"; ctx.fillRect(x * DS - w / 2 + 1, y * DS - 45 - e.size * 2, (w - 2) * Math.max(0, e.hp / e.max), 3);
    }
  }
  // the rule in force, at the bottom
  let s = null;
  if (mode === "refill")
    s = P.stock === "tear"
      ? `한 발 소지 ${capacity() / P.perPlace}${P.perPlace === 2 ? "쌍" : "개"} · ${P.place.toFixed(2)}초마다 ${P.perPlace === 2 ? "1쌍" : "1개"} · `
        + (P.reload ? `다 쓰면 ${(reloadInterval() / 30).toFixed(2)}초 뒤 다시 가득` : `${(refillInterval() / 30).toFixed(2)}초마다 +${P.refillAmt}${P.perPlace === 2 ? "쌍" : "개"}`)
        + ` · 바닥 ${landed()}개`
      : `아이작 소지 ${player.bag}/${capacity()} · ${P.place.toFixed(2)}초마다 ${P.perPlace === 2 ? "1쌍" : "1개"} · ${(refillInterval() / 30).toFixed(2)}초마다 +${P.bagRefill} · 바닥 ${landed()}개`;
  else if (mode === "interval")
    s = `[${PERIOD_MODES[P.periodMode]}] ${(dropInterval() / 30).toFixed(2)}초마다 ${P.perDrop}개 · 멈추면 ${stopCount()}개 · 눈물 ${tears.filter(t => !t.fromMine).length}개 · 바닥 ${landed()}개`;
  else if (mode === "now") s = `한 발 지뢰 ${payload()}개 · 바닥 ${landed()}개`;
  if (s) {
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.textAlign = "left"; ctx.font = "bold 14px 'Malgun Gothic', sans-serif";
    ctx.lineWidth = 4; ctx.strokeStyle = "#000"; ctx.strokeText(s, 14, canvas.height - 14);
    ctx.fillStyle = "#d8f0b0"; ctx.fillText(s, 14, canvas.height - 14);
  }
  if (paused) {
    ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.textAlign = "center";
    ctx.fillStyle = "rgba(0,0,0,0.5)"; ctx.fillRect(0, 0, canvas.width, canvas.height);
    ctx.fillStyle = "#fff"; ctx.font = "bold 22px 'Malgun Gothic'"; ctx.fillText("일시정지 (P)", canvas.width / 2, canvas.height / 2);
  }
}
function drawMine(m) {
  const [x, y] = px(m.x, m.y);
  const rx = Math.round(x), ry = Math.round(y);
  if (m.legs > 0) {   // Bobby-Bomb: four little legs, stepping while it walks
    ctx.strokeStyle = "#1c1a14"; ctx.lineWidth = 1.2;
    const step = Math.sin((m.walk || 0) * 0.6) * 1.5 * m.legs;
    for (const [lx, ly, s] of [[-4, -1, 1], [4, -1, -1], [-4, 1, -1], [4, 1, 1]]) {
      ctx.beginPath(); ctx.moveTo(rx + lx * 0.5, ry + ly - 2);
      ctx.lineTo(rx + lx * (1 + 0.5 * m.legs), ry + ly + 2 * m.legs + s * step); ctx.stroke();
    }
  }
  const blink = m.fuse >= 0 && tick % 2 === 0;
  const name = m.state === "land" ? "Land" : "Idle";
  drawAnim("mine", name, m.state === "land" ? m.t : m.t + m.id * 7, rx, ry - 2 * m.legs,
    { flash: blink, scale: m.small ? 0.65 : 1 });
}
function drawLaser(l) {
  const [x, y] = px(l.x, l.y);
  const len = 900, a = 1 - l.t / 14;
  ctx.save();
  ctx.globalAlpha = a;
  ctx.strokeStyle = "#ff3a2a"; ctx.lineWidth = 6 * a + 1; ctx.lineCap = "round";
  ctx.beginPath(); ctx.moveTo(x, y - 8); ctx.lineTo(x + l.dx * len, y - 8 + l.dy * len); ctx.stroke();
  ctx.strokeStyle = "#ffd0c0"; ctx.lineWidth = 2 * a + 0.5;
  ctx.beginPath(); ctx.moveTo(x, y - 8); ctx.lineTo(x + l.dx * len, y - 8 + l.dy * len); ctx.stroke();
  ctx.restore();
}
function drawGhost(g) {
  const [x, y] = px(g.x, g.y + g.z);
  const bob = Math.sin(g.t * 0.3) * 1.2;
  ctx.save();
  ctx.globalAlpha = 0.8;
  ctx.fillStyle = "#e8f0ff";
  ctx.beginPath(); ctx.ellipse(x, y + bob, 5, 6, 0, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = "#1a2030";
  ctx.fillRect(x - 3, y - 2 + bob, 2, 2); ctx.fillRect(x + 1, y - 2 + bob, 2, 2);
  ctx.restore();
}
function drawPlayer() {
  shadow(player.x, player.y, 9, 3.5);
  const [x, y] = px(player.x, player.y);
  const moving = Math.hypot(player.vx, player.vy) > 0.4;
  const body = "Walk" + (moving ? player.dir : "Down");
  drawAnim("isaac", body, moving ? player.walkT : 0, Math.round(x), Math.round(y), { flip: false });
  drawAnim("isaac", "Head" + player.head, player.shootT > 2 ? 2 : 0, Math.round(x), Math.round(y));
}
function drawEnemy(e) {
  const sc = e.size / 13;
  shadow(e.x, e.y, 9 * sc, 3.5 * sc, 0.35 * e.appear);
  const [x, y] = px(e.x, e.y);
  const hori = Math.abs(e.vx) > Math.abs(e.vy);
  const filter = e.burn ? "sepia(1) saturate(3) hue-rotate(-25deg) brightness(1.1)" : e.poison ? "sepia(1) saturate(3) hue-rotate(50deg)"
    : e.slow > 0 ? "grayscale(0.7) brightness(1.3)" : e.confuse > 0 ? "sepia(0.8)" : null;
  const o = { alpha: e.appear, flip: hori && e.vx < 0, flash: e.flash > 0, scale: sc, filter };
  drawAnim("gaper", hori ? "WalkHori" : "WalkVert", e.t, Math.round(x), Math.round(y), o);
  drawAnim("gaper", "Head", 0, Math.round(x), Math.round(y), { alpha: e.appear, flash: e.flash > 0, scale: sc, filter });
}
function drawTear(t) {
  shadow(t.x, t.y, 3, 1.3, 0.3);
  const [x, y] = px(t.x, t.y);
  const name = t.ludo ? "RegularTear10" : t.child ? "RegularTear2" : item() ? "RegularTear4" : "RegularTear6";
  drawAnim("tear", name, 0, x, y + t.z * S, t.fromMine ? { filter: "hue-rotate(-60deg) saturate(1.5)" } : {});
}
function drawFalling(m) {
  shadow(m.x, m.y, 5, 2, 0.3);
  const [x, y] = px(m.x, m.y);
  drawAnim("mine", "Fall", 0, x, y + m.z * S, { rot: m.rot, scale: m.small ? 0.65 : 1 });
}
function drawEffect(f) {
  const [x, y] = px(f.x, f.y);
  drawAnim(f.key, f.name, f.t, x, y + (f.z || 0) * S, { scale: f.scale, green: f.green });
}

// ---------------------------------------------------------------- panel
function sliderRow(obj, [key, label, min, max, step, fmt]) {
  const row = document.createElement("div"); row.className = "row";
  row.innerHTML = `<label>${label}</label><input type="range" min="${min}" max="${max}" step="${step}" value="${obj[key]}"><output>${fmt(obj[key])}</output>`;
  const input = row.querySelector("input"), out = row.querySelector("output");
  input.addEventListener("input", () => { obj[key] = parseFloat(input.value); out.textContent = fmt(obj[key]); });
  return row;
}
function checkRow(obj, key, label) {
  const row = document.createElement("div"); row.className = "check";
  row.innerHTML = `<input type="checkbox" ${obj[key] ? "checked" : ""}><label>${label}</label>`;
  row.querySelector("input").addEventListener("change", ev => { obj[key] = ev.target.checked; });
  return row;
}
function buildParams() {
  const box = document.getElementById("params");
  box.innerHTML = "<h2>숫자</h2>";
  if (mode === "refill") {   // who holds the mines
    const row = document.createElement("div"); row.className = "modes"; row.style.margin = "2px 0 6px";
    for (const [key, label] of [["tear", "소지: 눈물마다"], ["bag", "소지: 아이작이"]]) {
      const b = document.createElement("button"); b.textContent = label;
      b.classList.toggle("on", P.stock === key);
      b.onclick = () => { P.stock = key; buildParams(); reset(); };
      row.appendChild(b);
    }
    box.appendChild(row);
  }
  if (mode === "interval") {   // which period the tears drop on
    const row = document.createElement("div"); row.className = "modes"; row.style.margin = "2px 0 6px";
    for (const [key, label] of Object.entries(PERIOD_MODES)) {
      const b = document.createElement("button"); b.textContent = "주기: " + label;
      b.classList.toggle("on", P.periodMode === key);
      b.onclick = () => { P.periodMode = key; buildParams(); };
      row.appendChild(b);
    }
    box.appendChild(row);
  }
  for (const s of SLIDERS[mode]) {
    const show = !s[6] || (typeof s[6] === "function" ? s[6](P) : s[6].split(" ").includes(P.periodMode));
    if (show) box.appendChild(sliderRow(P, s));
  }
  if (mode === "now") box.appendChild(checkRow(P, "dump", "맞거나 벽에 닿으면 남은 지뢰를 쏟음"));
  if (mode === "interval" && P.periodMode === "luck") box.appendChild(checkRow(P, "stopLuck", "행운이 멈춘 자리 지뢰도 늘림"));
  if (mode === "refill" && P.stock === "tear") {
    const row = checkRow(P, "reload", "다 쓰고 나서 기다렸다가 한꺼번에 채움");
    row.querySelector("input").addEventListener("change", () => buildParams());
    box.appendChild(row);
  }
  if (item()) box.appendChild(checkRow(P, "playerSteps", "내가 밟아도 터짐 (피해는 없음)"));
  const note = document.createElement("div"); note.className = "note"; note.style.marginTop = "6px";
  note.textContent = NOTES[mode];
  box.appendChild(note);
}
function buildSynergies() {
  const tear = document.getElementById("syn-tear");
  tear.innerHTML = "<h2>눈물 시너지</h2>";
  tear.appendChild(sliderRow(SYN, ["multishot", "멀티샷 (눈물 수)", 1, 4, 1, v => v.toFixed(0) + "발"]));
  const grid = document.createElement("div"); grid.className = "syn";
  for (const [key, name, tip] of TEAR_SYN) grid.appendChild(synBox(key, name, tip));
  tear.appendChild(grid);
  const n1 = document.createElement("div"); n1.className = "note"; n1.style.marginTop = "6px";
  n1.textContent = "켜면 그 아이템을 가진 것처럼 눈물이 바뀝니다(아이템의 능력치 변화는 빼고). 시너지 코드는 따로 없고, 바뀐 눈물에 같은 규칙이 그대로 적용될 뿐입니다.";
  tear.appendChild(n1);
  const bomb = document.getElementById("syn-bomb");
  bomb.innerHTML = "<h2>폭탄 시너지</h2>";
  const grid2 = document.createElement("div"); grid2.className = "syn";
  for (const [key, name, tip] of BOMB_SYN) grid2.appendChild(synBox(key, name, tip));
  bomb.appendChild(grid2);
  const n2 = document.createElement("div"); n2.className = "note"; n2.style.marginTop = "6px";
  n2.textContent = "실제 구현은 지뢰 폭발에 플레이어의 폭탄 효과를 실어 터뜨리는 방식이라, 여기 없는 폭탄 아이템(다른 모드 것 포함)도 저절로 따라옵니다. 미리보기는 대표적인 것만 흉내 냅니다.";
  bomb.appendChild(n2);
}
function synBox(key, name, tip) {
  const label = document.createElement("label"); label.title = tip;
  label.innerHTML = `<input type="checkbox" ${SYN[key] ? "checked" : ""}>${name}`;
  label.querySelector("input").addEventListener("change", ev => { SYN[key] = ev.target.checked; });
  return label;
}
function buildWorld() {
  const box = document.getElementById("world");
  box.innerHTML = "<h2>아이작과 적</h2>";
  for (const s of WORLD_SLIDERS) box.appendChild(sliderRow(W, s));
}
function setMode(m) {
  mode = m; P = MODES[m];
  for (const k of Object.keys(MODES)) document.getElementById("mode-" + k).classList.toggle("on", k === m);
  buildParams(); reset();
}
function setScenario(s) {
  Object.assign(W, SCENARIOS[s]); W.scenario = s;
  for (const k of Object.keys(SCENARIOS)) document.getElementById("scen-" + k).classList.toggle("on", k === s);
  buildWorld(); reset();
}
for (const k of Object.keys(MODES)) document.getElementById("mode-" + k).onclick = () => setMode(k);
for (const k of Object.keys(SCENARIOS)) document.getElementById("scen-" + k).onclick = () => setScenario(k);
addEventListener("keydown", ev => {
  ensureAudio();
  if (["ArrowUp", "ArrowDown", "ArrowLeft", "ArrowRight", "Space"].includes(ev.code)) ev.preventDefault();
  if (["ArrowUp", "ArrowDown", "ArrowLeft", "ArrowRight", "KeyW", "KeyA", "KeyS", "KeyD"].includes(ev.code))
    document.getElementById("demo").checked = false;
  if (ev.code === "KeyR") reset();
  if (ev.code === "KeyP") paused = !paused;
  keys.add(ev.code);
});
addEventListener("keyup", ev => keys.delete(ev.code));
addEventListener("pointerdown", ensureAudio);
document.getElementById("sound").addEventListener("change", ensureAudio);

(async function start() {
  for (const src of DATA.sheets) {
    const img = await loadImage(src);
    IMG.push(img); GREEN.push(tint(img, 0.75, 1, 0.6, 0.06));
  }
  ROOMIMG = await loadImage(DATA.room);
  buildParams(); buildSynergies(); buildWorld(); reset();
  let last = performance.now(), acc = 0;
  function frame(now) {
    acc += Math.min(250, now - last); last = now;
    while (acc >= 1000 / 30) { if (!paused) update(); acc -= 1000 / 30; }
    render();
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
})();
</script>
</body>
